{% extends "layout.html" %}

{% block content %}
<style>
    .transaction-container {
        max-width: 600px;
        margin: 60px auto;
        padding: 20px;
    }

    .transaction-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        transition: all 0.3s;
        animation: fadeIn 0.4s;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .transaction-card:hover {
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        transform: translateY(-4px);
    }

    .transaction-card h2 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--dark);
    }

    .transaction-card .subtitle {
        color: var(--gray);
        font-size: 14px;
        margin-bottom: 32px;
    }

    .input-group {
        margin-bottom: 28px;
    }

    .input-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: var(--gray);
        font-size: 14px;
    }

    .input-group input {
        width: 100%;
        padding: 16px 18px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s;
        background: white;
        box-sizing: border-box;
    }

    .input-group input:focus {
        outline: none;
        border-color: var(--secondary);
        box-shadow: 0 0 0 4px rgba(52, 168, 83, 0.1);
    }

    .deposit-btn {
        width: 100%;
        padding: 18px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        background: var(--secondary);
        color: white;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .deposit-btn:hover {
        background: #2d8e47;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(52, 168, 83, 0.4);
    }

    .info-box {
        background: #e8f5e9;
        border-left: 4px solid var(--secondary);
        padding: 16px 20px;
        border-radius: 8px;
        margin-bottom: 24px;
        font-size: 14px;
        color: #1b5e20;
    }

    .info-box strong {
        font-weight: 600;
    }

    .alert {
        padding: 14px 18px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        font-weight: 500;
        display: none;
        animation: slideDown 0.3s;
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .alert.error {
        background: #ffebee;
        color: #c62828;
        border-left: 4px solid #c62828;
        display: block;
    }
</style>

<div class="transaction-container">
    <div class="transaction-card">
        <h2>💰 입금</h2>
        <p class="subtitle">계좌에 돈을 입금하세요</p>

        <div class="info-box">
            <strong>안내:</strong> 최대 입금 금액은 1회당 100원입니다.
        </div>

        <div id="error-message" class="alert"></div>

        <form id="deposit-form">
            <div class="input-group">
                <label for="amount">금액 (원)</label>
                <input type="number" id="amount" name="amount" placeholder="금액 입력" min="1" max="100" required autofocus>
            </div>
            <button type="submit" class="deposit-btn">입금하기</button>
        </form>
    </div>
</div>
{% endblock %}
